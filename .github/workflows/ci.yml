name: CI Verification

on:
  push:
    branches: [ main ]

env:
  IMAGE: stock-analyzer
  URL: http://127.0.0.1:8081/api/health
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        shell: powershell
        run: docker build -t $env:IMAGE .

      - name: Deploy and verify
        shell: powershell
        run: |
          function Check($n) {
            $ok = 0
            for ($i = 0; $i -lt $n; $i++) {
              try {
                if ((Invoke-WebRequest $env:URL -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { $ok++ }
              } catch {}
              Start-Sleep -Milliseconds 300
            }
            return $ok
          }

          # 기존 서버가 없으면 먼저 띄우기
          if (-not (docker ps -q -f "name=^stock-live$")) {
            docker rm -f stock-live 2>$null
            docker run -d --name stock-live -p 8081:8000 $env:IMAGE
            Start-Sleep -Seconds 10
          }

          $before = Check 1

          # 재배포
          docker rm -f stock-live
          docker run -d --name stock-live -p 8081:8000 $env:IMAGE
          $during = Check 10

          $after = Check 5

          $res = { param($ok, $n) if ($ok -eq $n) { 'OK' } else { 'FAIL' } }
          @(
            '## Stock Analyzer deployment verification'
            ''
            '| Stage | Requests (ok/total) | Result |'
            '|---|---|---|'
            "| Before | $before/1 | $(& $res $before 1) |"
            "| During | $during/10 | $(& $res $during 10) |"
            "| After | $after/5 | $(& $res $after 5) |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8