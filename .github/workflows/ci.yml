name: CI Verification

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Write Summary Test
      run: |
        "### Test Summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
        "Result: SUCCESS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8