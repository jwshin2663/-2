name: Stock Analyzer CI

on:
  push:
    branches: [ main ]

jobs:
  build-test-publish:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        shell: powershell
        run: |
          Write-Host "Starting Docker build..."
          docker build -t jwshin2663/stock-analyzer:latest .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Pushing Docker image to Docker Hub..."
          docker push jwshin2663/stock-analyzer:latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate Summary Report
        shell: powershell
        run: |
          $summaryContent = @"
          ### 📊 Stock Analyzer Pipeline Execution Summary
          
          | Phase | Status | Details / Metrics |
          | :--- | :--- | :--- |
          | **Before** | 🔄 Completed | Environment initialized, workspace cleaned, dependencies verified |
          | **During** | ⚡ Success | Docker image built locally & pushed to Docker Hub (`jwshin2663/stock-analyzer:latest`) |
          | **After** | ✅ Verified | CI workflow passed successfully on Windows Self-Hosted Runner |
          
          > **Note:** Automated pipeline executed via GitHub Actions on local runner environment.
          "@
          
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summaryContent
          Write-Host "Summary generated successfully."