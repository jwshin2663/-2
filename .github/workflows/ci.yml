name: Stock Analyzer CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build, run, and verify stock API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = "stock_analyzer:$env:GITHUB_SHA"
          $container = "stock-analyzer-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $containerStarted = $false
          $allPassed = $true
          $failureNote = ''
          $script:totalRequests = 0
          $healthPassed = 0
          $healthTotal = 0
          $phases = [ordered]@{
            Before = [pscustomobject]@{ Requests = '0/0'; Representative = '-'; UtcStart = '-'; Http = '-'; Analysis = '-'; Result = '미실행' }
            During = [pscustomobject]@{ Requests = '0/0'; Representative = '-'; UtcStart = '-'; Http = '-'; Analysis = '-'; Result = '미실행' }
            After = [pscustomobject]@{ Requests = '0/0'; Representative = '-'; UtcStart = '-'; Http = '-'; Analysis = '-'; Result = '미실행' }
          }

          function Get-UtcTimestamp {
            [DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          }

          function Test-StockEndpoint {
            param([string]$BaseUrl)

            $script:totalRequests++
            $requestId = $script:totalRequests
            $http = 'ERROR'
            $analysis = 'FAIL'
            $result = 'FAIL'
            try {
              $response = Invoke-RestMethod -Uri "$BaseUrl/api/stock?ticker=AAPL&period=1mo" -TimeoutSec 60
              $http = '200'
              if ($response.ticker -ne 'AAPL' -or $response.data.Count -lt 2 -or $response.stats.observations -lt 2 -or $response.stats.latest -le 0) {
                throw '응답에 유효한 AAPL 가격 분석 데이터가 없습니다.'
              }
              $latest = ([double]$response.stats.latest).ToString('0.####', [Globalization.CultureInfo]::InvariantCulture)
              $currency = if ($response.currency) { " $($response.currency)" } else { '' }
              $analysis = "PASS: $($response.ticker)/$($response.period), $($response.stats.observations) observations, latest=$latest$currency"
              $result = 'PASS'
            } catch {
              $script:allPassed = $false
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $http = [string][int]$_.Exception.Response.StatusCode
              }
              $analysis = "FAIL: $($_.Exception.Message -replace '[|\r\n]', ' ')"
            }

            [pscustomobject]@{
              Request = "#$requestId"
              Http = $http
              Analysis = $analysis
              Result = $result
            }
          }

          try {
            docker build --pull --tag $image .
            if ($LASTEXITCODE -ne 0) { throw "Docker image build failed with exit code $LASTEXITCODE." }

            docker run --detach --name $container --publish '127.0.0.1::8000' $image
            if ($LASTEXITCODE -ne 0) { throw "Docker container start failed with exit code $LASTEXITCODE." }
            $containerStarted = $true

            $mapping = (docker port $container '8000/tcp' | Select-Object -First 1).Trim()
            if ($mapping -notmatch ':(\d+)$') { throw "Could not determine the mapped container port: $mapping" }
            $baseUrl = "http://127.0.0.1:$($Matches[1])"

            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "$baseUrl/api/health" -TimeoutSec 3
                if ($health.status -eq 'ok' -and $health.service -eq 'stock-lens') {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) { throw 'FastAPI health endpoint did not become ready within 60 seconds.' }

            $beforeStart = Get-UtcTimestamp
            $before = Test-StockEndpoint -BaseUrl $baseUrl
            $phases.Before = [pscustomobject]@{
              Requests = "$([int]($before.Result -eq 'PASS'))/1"
              Representative = $before.Request
              UtcStart = $beforeStart
              Http = $before.Http
              Analysis = $before.Analysis
              Result = $before.Result
            }

            $duringStart = Get-UtcTimestamp
            for ($probe = 0; $probe -lt 20; $probe++) {
              $script:totalRequests++
              $healthTotal++
              try {
                $health = Invoke-RestMethod -Uri "$baseUrl/api/health" -TimeoutSec 10
                if ($health.status -eq 'ok' -and $health.service -eq 'stock-lens') {
                  $healthPassed++
                } else {
                  $allPassed = $false
                }
              } catch {
                $allPassed = $false
              }
            }
            $during = Test-StockEndpoint -BaseUrl $baseUrl
            $duringPassed = $healthPassed + [int]($during.Result -eq 'PASS')
            $duringTotal = $healthTotal + 1
            $phases.During = [pscustomobject]@{
              Requests = "$duringPassed/$duringTotal"
              Representative = $during.Request
              UtcStart = $duringStart
              Http = $during.Http
              Analysis = $during.Analysis
              Result = if ($duringPassed -eq $duringTotal) { 'PASS' } else { 'FAIL' }
            }

            $afterStart = Get-UtcTimestamp
            $after = Test-StockEndpoint -BaseUrl $baseUrl
            $phases.After = [pscustomobject]@{
              Requests = "$([int]($after.Result -eq 'PASS'))/1"
              Representative = $after.Request
              UtcStart = $afterStart
              Http = $after.Http
              Analysis = $after.Analysis
              Result = $after.Result
            }
          } catch {
            $allPassed = $false
            $failureNote = $_.Exception.Message -replace '[|\r\n]', ' '
          } finally {
            if ($containerStarted) {
              docker rm --force $container | Out-Null
            }

            $summary = [System.Collections.Generic.List[string]]::new()
            $summary.Add('### 주식 데이터 검증 (Before / During / After)')
            $summary.Add('')
            $summary.Add("- 검증 종목/기간: `AAPL` / `1mo` (실제 yfinance 조회)")
            $summary.Add("- During 구간 health 요청: $healthPassed/$healthTotal 성공; 전체 검증 요청: $script:totalRequests")
            if ($failureNote) { $summary.Add("- 실행 오류: $failureNote") }
            $summary.Add('')
            $summary.Add('| Stage | Requests (ok/total) | Representative request | UTC start | HTTP | Analysis | Response revision | Result |')
            $summary.Add('|---|---:|---|---|---:|---|---|---|')
            foreach ($stage in @('Before', 'During', 'After')) {
              $phase = $phases[$stage]
              $summary.Add("| $stage | $($phase.Requests) | $($phase.Representative) | $($phase.UtcStart) | $($phase.Http) | $($phase.Analysis) | $env:GITHUB_SHA | $($phase.Result) |")
            }
            $summary.Add('')
            $summary.Add("- 컨테이너 이미지: ``$image``")
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($summary -join [Environment]::NewLine) + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          }

          if (-not $allPassed) { throw 'Stock API verification failed. See the Step Summary for measured results.' }

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $localImage = "stock_analyzer:$env:GITHUB_SHA"
          $latestImage = "$env:DOCKERHUB_USERNAME/stock_analyzer:latest"
          $revisionImage = "$env:DOCKERHUB_USERNAME/stock_analyzer:$env:GITHUB_SHA"
          docker tag $localImage $latestImage
          if ($LASTEXITCODE -ne 0) { throw 'Could not tag image as latest.' }
          docker tag $localImage $revisionImage
          if ($LASTEXITCODE -ne 0) { throw 'Could not tag image with the commit SHA.' }
          docker push $latestImage
          if ($LASTEXITCODE -ne 0) { throw 'Could not push latest image.' }
          docker push $revisionImage
          if ($LASTEXITCODE -ne 0) { throw 'Could not push revision image.' }