name: CI Verification

on:
  push:
    branches: [ main ]

env:
  IMAGE: stock-analyzer
  URL: http://127.0.0.1:8081/api/health   # 외부에서 접속하는 고정 주소 (nginx 프록시)

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        shell: powershell
        run: docker build -t $env:IMAGE .

      - name: Deploy and verify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $net   = 'stocknet'
          $proxy = 'stock-proxy'
          $path  = ([uri]$env:URL).AbsolutePath
          $ok    = @{ Before = 0; During = 0; After = 0 }
          $total = @{ Before = 0; During = 0; After = 0 }

          function Probe {
            try { return ((Invoke-WebRequest $env:URL -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) }
            catch { return $false }
          }
          function Check($stage) {
            $script:total[$stage]++
            if (Probe) { $script:ok[$stage]++ }
          }
          function Healthy($slot) {
            docker exec $proxy wget -q -O /dev/null "http://${slot}:8000$path" | Out-Null
            return ($LASTEXITCODE -eq 0)
          }
          function Set-Upstream($target) {
            $conf = "server {`n  listen 80;`n  location / {`n    proxy_pass http://${target}:8000;`n  }`n}`n"
            $tmp  = Join-Path $env:RUNNER_TEMP 'default.conf'
            [System.IO.File]::WriteAllText($tmp, $conf, (New-Object System.Text.UTF8Encoding($false)))
            docker cp $tmp "${proxy}:/etc/nginx/conf.d/default.conf" | Out-Null
            docker exec $proxy nginx -s reload | Out-Null   # 무중단 reload
          }

          # 0) 이전 방식 컨테이너 정리 + 네트워크 준비
          docker rm -f stock-live | Out-Null
          if (-not (docker network ls -q -f 'name=^stocknet$')) { docker network create $net | Out-Null }

          # 1) 프록시(고정 주소 8081) 준비
          $proxyFresh = $false
          if (-not (docker ps -q -f 'name=^stock-proxy$')) {
            docker rm -f $proxy | Out-Null
            docker run -d --name $proxy --network $net -p 8081:80 nginx:alpine | Out-Null
            Start-Sleep -Seconds 3
            $proxyFresh = $true
          }

          # 2) 현재 운영 중인 슬롯(blue/green) 확인, 없으면 blue로 첫 기동
          if (docker ps -q -f 'name=^stock-blue$')       { $old = 'stock-blue';  $new = 'stock-green' }
          elseif (docker ps -q -f 'name=^stock-green$')  { $old = 'stock-green'; $new = 'stock-blue' }
          else {
            docker rm -f stock-blue | Out-Null
            docker run -d --name stock-blue --network $net $env:IMAGE | Out-Null
            for ($i = 0; $i -lt 60; $i++) { if (Healthy 'stock-blue') { break }; Start-Sleep -Seconds 1 }
            $old = 'stock-blue'; $new = 'stock-green'
            $proxyFresh = $true
          }
          if ($proxyFresh) { Set-Upstream $old }

          # 기존 서버가 고정 주소로 응답할 때까지 대기 (측정 전 준비)
          for ($i = 0; $i -lt 30; $i++) { if (Probe) { break }; Start-Sleep -Seconds 1 }

          # 3) BEFORE
          Check 'Before'

          # 4) DURING: 새 슬롯 기동 -> 준비될 때까지 계속 요청 -> 프록시 전환 -> 계속 요청
          docker rm -f $new | Out-Null
          docker run -d --name $new --network $net $env:IMAGE | Out-Null
          for ($i = 0; $i -lt 120; $i++) {
            Check 'During'
            if (Healthy $new) { break }
            Start-Sleep -Milliseconds 500
          }
          Set-Upstream $new
          for ($i = 0; $i -lt 5; $i++) { Check 'During'; Start-Sleep -Milliseconds 300 }
          docker rm -f $old | Out-Null

          # 5) AFTER
          for ($i = 0; $i -lt 5; $i++) { Check 'After'; Start-Sleep -Milliseconds 300 }

          # 6) Step Summary
          function Verdict($s) { if ($ok[$s] -eq $total[$s]) { 'OK' } else { 'FAIL' } }
          $allOk  = $ok.Before + $ok.During + $ok.After
          $allTot = $total.Before + $total.During + $total.After
          $failed = $allTot - $allOk
          $result = if ($failed -eq 0) { 'SUCCESS' } else { 'FAILED' }

          @(
            '## Stock Analyzer deployment verification'
            ''
            "**Result:** $result | **Stable URL:** $env:URL"
            ''
            "**API requests:** $allTot total, $allOk successful, $failed failed"
            ''
            '| Stage | Requests (ok/total) | Result |'
            '|---|---|---|'
            "| Before | $($ok.Before)/$($total.Before) | $(Verdict 'Before') |"
            "| During | $($ok.During)/$($total.During) | $(Verdict 'During') |"
            "| After | $($ok.After)/$($total.After) | $(Verdict 'After') |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $global:LASTEXITCODE = 0
          if ($failed -gt 0) { exit 1 }